<style>

box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#e9edf2;--card-t:#12171d;--btn:#1c2530;--btn-t:#e9edf2;--bd:#2c3846}}
:root[data-theme="dark"]{--bg:#12171d;--card:#e9edf2;--card-t:#12171d;--btn:#1c2530;--btn-t:#e9edf2;--bd:#2c3846}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--btn-t);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.menu{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,auto);gap:12px;width:100%;max-width:980px}
.btn{background:var(--btn);color:var(--btn-t);border:1px solid var(--bd);border-radius:12px;padding:18px 8px;font-size:1rem;font-weight:600;text-decoration:none;text-align:center;transition:.18s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.btn span{font-size:1.5rem}
.btn:hover,.btn:focus-visible{transform:translateY(-3px);border-color:var(--ac);box-shadow:0 6px 16px rgba(0,0,0,.15);outline:none}
.btn:active{background:var(--ac);color:#fff;border-color:var(--ac)}
.center{grid-column:2/5;grid-row:2/5;background:var(--card);color:var(--card-t);border-radius:16px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:240px}
.center h1{margin:0;font-size:clamp(1.4rem,3vw,2rem)}
.center p{margin:0;opacity:.85}
.tag{background:var(--ac);color:#fff;border-radius:99px;padding:4px 14px;font-size:.85rem;font-weight:600}
/* posições: topo (linha 1), laterais (linhas 2-4), base (linha 5) */
.b1{grid-area:1/1}.b2{grid-area:1/2}.b3{grid-area:1/3}.b4{grid-area:1/4}.b5{grid-area:1/5}
.b6{grid-area:2/1}.b7{grid-area:2/5}.b8{grid-area:3/1}.b9{grid-area:3/5}.b10{grid-area:4/1}.b11{grid-area:4/5}
.b12{grid-area:5/1}.b13{grid-area:5/2}.b14{grid-area:5/3}.b15{grid-area:5/4}.b16{grid-area:5/5}
@media(max-width:700px){
.menu{grid-template-columns:repeat(2,1fr);grid-template-rows:none}
.menu .btn{grid-area:auto}
.center{grid-area:auto;grid-column:1/-1;order:-1}
}
</style>
