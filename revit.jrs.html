<style>
:root{--bg:#f1f4f2;--cd:#fff;--tx:#18241f;--mu:#1fe122;--bd:#d3dcd7;--pr:#374151;--pt:#fff;--ac:#c8892b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}


/* menu simples */
.menu{background:var(--pr);color:var(--pt)}
.menu .wrap{display:flex;align-items:center;justify-content:space-between;min-height:56px;position:relative}
.menu strong{font-size:1.1rem}
.menu nav{display:flex;gap:4px}
.menu nav a{color:inherit;text-decoration:none;padding:8px 12px;border-radius:6px}
.menu nav a:hover{background:rgba(255,255,255,.18)}
#mb{display:none;background:none;border:1px solid #fff;color:#fff;border-radius:6px;font-size:1.2rem;padding:4px 10px;cursor:pointer}
@media (max-width:700px){
  #mb{display:block}
  .menu nav{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;background:var(--pr);padding:8px 16px 14px}
  .menu nav.aberto{display:flex}
}

.btn{margin-top:auto;display:inline-block;text-align:center;text-decoration:none;background:var(--pr);color:var(--pt);padding:9px 14px;border-radius:6px}

img {

}
@media (max-width: 700px) {

}
</style>
